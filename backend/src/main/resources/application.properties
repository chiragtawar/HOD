spring.application.name=properties-backend
server.port=${PORT:8080}

# Database Configuration
# Default to H2 if variables are not set (Local Dev)
# On Railway/Render, set SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/propertydb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

# H2 Console (Enable only if using H2)
spring.h2.console.enabled=true

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}

# CORS Configuration
# Default to localhost if not set
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# CORS
management.endpoints.web.exposure.include=*
